<svg xmlns="http://www.w3.org/2000/svg" width="306" height="266" viewBox="0 0 306 266">
  <defs>
    <linearGradient id="bg-ml" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ecd9fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e272e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="306" height="266" rx="16" fill="url(#bg-ml)" />

  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="6" fill="#6c3de8" opacity="0.12" />
  <circle cx="276" cy="236" r="8" fill="#fd79a8" opacity="0.15" />
  <rect x="20" y="240" width="40" height="3" rx="1.5" fill="#6c3de8" opacity="0.15" />
  <rect x="246" y="20" width="40" height="3" rx="1.5" fill="#fd79a8" opacity="0.15" />

  <!-- Neural Network & Chip -->
  <g transform="translate(153, 140)">
    <!-- Connecting Lines (Left) -->
    <line x1="-35" y1="-20" x2="-75" y2="-40" stroke="#a29bfe" stroke-width="4" stroke-linecap="round" />
    <line x1="-35" y1="0" x2="-75" y2="0" stroke="#a29bfe" stroke-width="4" stroke-linecap="round" />
    <line x1="-35" y1="20" x2="-75" y2="40" stroke="#a29bfe" stroke-width="4" stroke-linecap="round" />
    
    <!-- Connecting Lines (Right) -->
    <line x1="35" y1="-20" x2="75" y2="-40" stroke="#a29bfe" stroke-width="4" stroke-linecap="round" />
    <line x1="35" y1="0" x2="75" y2="0" stroke="#a29bfe" stroke-width="4" stroke-linecap="round" />
    <line x1="35" y1="20" x2="75" y2="40" stroke="#a29bfe" stroke-width="4" stroke-linecap="round" />

    <!-- Left Nodes -->
    <circle cx="-75" cy="-40" r="8" fill="#fd79a8" />
    <circle cx="-75" cy="0" r="8" fill="#fd79a8" />
    <circle cx="-75" cy="40" r="8" fill="#fd79a8" />

    <!-- Right Nodes -->
    <circle cx="75" cy="-40" r="8" fill="#00b894" />
    <circle cx="75" cy="0" r="8" fill="#00b894" />
    <circle cx="75" cy="40" r="8" fill="#00b894" />

    <!-- Central AI Chip -->
    <rect x="-35" y="-35" width="70" height="70" rx="8" fill="url(#chipGrad)" stroke="#6c3de8" stroke-width="4" />
    <!-- Chip Inner Circuit -->
    <path d="M-15,-15 L15,15 M-15,15 L15,-15" stroke="#6c3de8" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6" fill="#6c3de8" />
    <!-- Chip Pins -->
    <rect x="-45" y="-25" width="10" height="4" rx="2" fill="#6c3de8" />
    <rect x="-45" y="-10" width="10" height="4" rx="2" fill="#6c3de8" />
    <rect x="-45" y="5" width="10" height="4" rx="2" fill="#6c3de8" />
    <rect x="-45" y="20" width="10" height="4" rx="2" fill="#6c3de8" />
    <rect x="35" y="-25" width="10" height="4" rx="2" fill="#6c3de8" />
    <rect x="35" y="-10" width="10" height="4" rx="2" fill="#6c3de8" />
    <rect x="35" y="5" width="10" height="4" rx="2" fill="#6c3de8" />
    <rect x="35" y="20" width="10" height="4" rx="2" fill="#6c3de8" />
  </g>

  <!-- Text Labels -->
  <text x="153" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#2d3436">MACHINE LEARNING</text>
  <text x="153" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#6c3de8">ML ENGINEER</text>
</svg>