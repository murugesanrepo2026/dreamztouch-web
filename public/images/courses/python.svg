<svg xmlns="http://www.w3.org/2000/svg" width="306" height="266" viewBox="0 0 306 266">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dce4ec;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3776ab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2b5f8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pythonGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd343;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5c21a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="306" height="266" rx="16" fill="url(#bg2)" />

  <!-- Python Logo -->
  <g transform="translate(153, 135)">
    <!-- Left snake body -->
    <path d="M-40,-10 C-40,-40 -10,-45 10,-40 C25,-36 30,-25 30,-15 C30,-5 25,0 10,0 C-5,0 -15,5 -15,15 C-15,25 -10,30 10,35 C30,40 40,35 40,10" fill="none" stroke="#3776ab" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right snake body -->
    <path d="M40,10 C40,40 10,45 -10,40 C-25,36 -30,25 -30,15 C-30,5 -25,0 -10,0 C5,0 15,-5 15,-15 C15,-25 10,-30 -10,-35 C-30,-40 -40,-35 -40,-10" fill="none" stroke="#ffd343" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Eyes -->
    <circle cx="-28" cy="-22" r="6" fill="white" />
    <circle cx="-28" cy="-22" r="3" fill="#222" />
    <circle cx="28" cy="22" r="6" fill="white" />
    <circle cx="28" cy="22" r="3" fill="#222" />
    <!-- Python text -->
    <text x="0" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#3776ab">PYTHON</text>
  </g>

  <!-- "Developer" label -->
  <text x="153" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="14" fill="#7a8a9a" letter-spacing="1">DEVELOPER</text>

  <!-- Decor -->
  <circle cx="40" cy="30" r="6" fill="#3776ab" opacity="0.12" />
  <circle cx="266" cy="236" r="8" fill="#ffd343" opacity="0.15" />
  <rect x="20" y="240" width="40" height="3" rx="1.5" fill="#3776ab" opacity="0.15" />
  <rect x="246" y="20" width="40" height="3" rx="1.5" fill="#ffd343" opacity="0.15" />
</svg>
