<svg xmlns="http://www.w3.org/2000/svg" width="306" height="266" viewBox="0 0 306 266">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6ddf2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8892bf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6f7aaa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phpGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f5b93;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#39447a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="306" height="266" rx="16" fill="url(#bg3)" />

  <!-- PHP Elephant -->
  <g transform="translate(153, 140)">
    <!-- Elephant body -->
    <ellipse cx="0" cy="5" rx="55" ry="40" fill="#8892bf" />
    <!-- Elephant head -->
    <circle cx="-35" cy="-10" r="30" fill="#8892bf" />
    <!-- Trunk -->
    <path d="M-55,-10 C-70,-10 -75,0 -70,15 C-65,25 -55,25 -50,20" fill="none" stroke="#8892bf" stroke-width="14" stroke-linecap="round" />
    <!-- Ear -->
    <path d="M-45,-35 C-55,-50 -35,-55 -25,-40" fill="#6f7aaa" stroke="#6f7aaa" stroke-width="2" />
    <!-- Eye -->
    <circle cx="-42" cy="-15" r="5" fill="white" />
    <circle cx="-43" cy="-15" r="2.5" fill="#222" />
    <!-- Tusk -->
    <path d="M-50,-5 C-55,0 -52,8 -48,5" fill="none" stroke="#f0ebf0" stroke-width="4" stroke-linecap="round" />
    <!-- PHP text -->
    <text x="15" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#4f5b93">PHP</text>
    <!-- Small elephant decor -->
    <circle cx="30" cy="-15" r="4" fill="#4f5b93" opacity="0.2" />
  </g>

  <!-- "Developer" label -->
  <text x="153" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="14" fill="#7a6f9a" letter-spacing="1">DEVELOPER</text>

  <!-- Decor -->
  <circle cx="30" cy="30" r="6" fill="#8892bf" opacity="0.12" />
  <circle cx="276" cy="236" r="8" fill="#4f5b93" opacity="0.12" />
  <rect x="20" y="240" width="40" height="3" rx="1.5" fill="#8892bf" opacity="0.15" />
  <rect x="246" y="20" width="40" height="3" rx="1.5" fill="#4f5b93" opacity="0.15" />
</svg>
