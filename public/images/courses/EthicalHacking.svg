<svg xmlns="http://www.w3.org/2000/svg" width="306" height="266" viewBox="0 0 306 266">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg-eth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f8fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dfeaf8;stop-opacity:1" />
    </linearGradient>
    <!-- 盾牌渐变 -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2a44;stop-opacity:1" />
    </linearGradient>
    <!-- 盾牌内层渐变 -->
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c4e72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3455;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="306" height="266" rx="16" fill="url(#bg-eth)" />

  <!-- 科技感装饰元素（雷达波纹、二进制、括号） -->
  <g transform="translate(153, 130)">
    <!-- 雷达波纹 -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="6 6" opacity="0.15" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="4 8" opacity="0.10" />
    
    <!-- 浮动的代码括号 -->
    <text x="-85" y="-30" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#3498db" opacity="0.25">&#60; / &gt;</text>
    <text x="70" y="45" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#e67e22" opacity="0.20">&#123; &#125;</text>
    <text x="-80" y="50" font-family="'Courier New', monospace" font-weight="bold" font-size="12" fill="#2ecc71" opacity="0.20">0101</text>
    <text x="75" y="-40" font-family="'Courier New', monospace" font-weight="bold" font-size="12" fill="#e74c3c" opacity="0.20">1010</text>
  </g>

  <!-- 主图标区域 -->
  <g transform="translate(153, 125)">
    
    <!-- === 白帽（象征道德黑客） === -->
    <!-- 帽檐 -->
    <rect x="-28" y="-46" width="56" height="8" rx="4" fill="#ffffff" stroke="#d5dbe3" stroke-width="2" />
    <!-- 帽冠 -->
    <rect x="-16" y="-66" width="32" height="20" rx="4" fill="#ffffff" stroke="#d5dbe3" stroke-width="2" />
    <!-- 蓝色装饰带 -->
    <rect x="-16" y="-48" width="32" height="4" fill="#3498db" />
    <!-- 帽顶圆点 -->
    <circle cx="0" cy="-66" r="3.5" fill="#3498db" />

    <!-- === 盾牌（象征安全防护） === -->
    <!-- 外层盾牌 -->
    <path d="M-48,-30 L-48,10 C-48,30 0,55 0,55 C0,55 48,30 48,10 L48,-30 L0,-58 Z" fill="url(#shieldGrad)" />
    <!-- 内层盾牌（增加立体感） -->
    <path d="M-38,-26 L-38,10 C-38,28 0,50 0,50 C0,50 38,28 38,10 L38,-26 L0,-52 Z" fill="url(#shieldInner)" />
    
    <!-- === 锁（安全防护） === -->
    <g transform="translate(-18, 0)">
      <!-- 锁梁 -->
      <path d="M-10,-8 L-10,-16 A8,8 0 0,1 6,-16 L6,-8" fill="none" stroke="#f1c40f" stroke-width="5" stroke-linecap="round" />
      <!-- 锁体 -->
      <rect x="-16" y="-8" width="28" height="20" rx="4" fill="#f1c40f" />
      <!-- 锁孔 -->
      <circle cx="-2" cy="2" r="3" fill="#1e3a5f" />
      <rect x="-4" y="4" width="4" height="6" rx="1" fill="#1e3a5f" />
    </g>

    <!-- === 终端提示符（黑客技术） === -->
    <g transform="translate(16, 0)">
      <!-- '大于' 符号 -->
      <path d="M-4,-10 L10,0 L-4,10" fill="none" stroke="#2ecc71" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- 闪烁光标 -->
      <rect x="14" y="-8" width="3" height="16" rx="1.5" fill="#2ecc71" />
    </g>

    <!-- 盾牌中央装饰分隔线 -->
    <line x1="-2" y1="-25" x2="-2" y2="25" stroke="#ffffff" stroke-width="1" opacity="0.10" />
  </g>

  <!-- 课程标题 -->
  <text x="153" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="24" fill="#1e3a5f">ETHICAL</text>
  <text x="153" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="18" fill="#e74c3c" letter-spacing="2.5">HACKING</text>
</svg>