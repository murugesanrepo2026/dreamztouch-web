<svg xmlns="http://www.w3.org/2000/svg" width="306" height="266" viewBox="0 0 306 266">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dce4f8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dotnetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#512bd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3e1fa8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dotnetGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c3de8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#512bd4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="306" height="266" rx="16" fill="url(#bg4)" />

  <!-- .NET Logo -->
  <g transform="translate(153, 138)">
    <!-- Dot symbol -->
    <circle cx="-45" cy="-5" r="20" fill="#512bd4" />
    <circle cx="-45" cy="-5" r="12" fill="white" />

    <!-- N letter -->
    <path d="M-15,-30 L-15,25 L15,-25 L15,30" fill="none" stroke="#512bd4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- E letter -->
    <path d="M25,-30 L55,-30 M25,-30 L25,30 M25,0 L50,0 M25,30 L55,30" fill="none" stroke="#512bd4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- T letter -->
    <path d="M65,-30 L95,-30 M80,-30 L80,30" fill="none" stroke="#512bd4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Small dots decoration -->
    <circle cx="-45" cy="45" r="4" fill="#512bd4" opacity="0.3" />
    <circle cx="15" cy="48" r="3" fill="#512bd4" opacity="0.2" />
    <circle cx="80" cy="45" r="4" fill="#512bd4" opacity="0.3" />

    <!-- .NET text -->
    <text x="25" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#3e1fa8">.NET</text>
  </g>

  <!-- "Developer" label -->
  <text x="153" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="14" fill="#6a5c9a" letter-spacing="1">DEVELOPER</text>

  <!-- Decor -->
  <circle cx="30" cy="30" r="6" fill="#512bd4" opacity="0.1" />
  <circle cx="276" cy="236" r="8" fill="#512bd4" opacity="0.1" />
  <rect x="20" y="240" width="40" height="3" rx="1.5" fill="#512bd4" opacity="0.12" />
  <rect x="246" y="20" width="40" height="3" rx="1.5" fill="#512bd4" opacity="0.12" />
</svg>
