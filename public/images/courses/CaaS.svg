<svg xmlns="http://www.w3.org/2000/svg" width="306" height="266" viewBox="0 0 306 266">
  <defs>
    <linearGradient id="bg-caas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dce6f5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="306" height="266" rx="16" fill="url(#bg-caas)" />
  
  <!-- 图标：集装箱 + 舵轮 -->
  <g transform="translate(153, 115)">
    <!-- 集装箱主体 -->
    <rect x="-45" y="-35" width="90" height="70" rx="4" fill="#2c3e50" />
    <rect x="-45" y="-15" width="90" height="4" fill="#f1c40f" />
    <rect x="-45" y="15" width="90" height="4" fill="#f1c40f" />
    <rect x="-45" y="35" width="90" height="4" fill="#f1c40f" />
    <!-- 锁扣 -->
    <rect x="-35" y="-30" width="6" height="6" rx="1" fill="#bdc3c7" />
    <rect x="29" y="-30" width="6" height="6" rx="1" fill="#bdc3c7" />
    <rect x="-35" y="24" width="6" height="6" rx="1" fill="#bdc3c7" />
    <rect x="29" y="24" width="6" height="6" rx="1" fill="#bdc3c7" />
    
    <!-- 舵轮（Kubernetes 风格）置于右上角 -->
    <g transform="translate(50, -30)">
      <circle cx="0" cy="0" r="22" fill="#3498db" />
      <path d="M0,-15 L0,15 M-15,0 L15,0 M-10,-10 L10,10 M-10,10 L10,-10" stroke="white" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="white" />
      <!-- 周围节点（代表集群） -->
      <circle cx="0" cy="-24" r="3.5" fill="#e67e22" />
      <circle cx="17" cy="-17" r="3.5" fill="#e67e22" />
      <circle cx="24" cy="0" r="3.5" fill="#e67e22" />
      <circle cx="17" cy="17" r="3.5" fill="#e67e22" />
      <circle cx="0" cy="24" r="3.5" fill="#e67e22" />
      <circle cx="-17" cy="17" r="3.5" fill="#e67e22" />
      <circle cx="-24" cy="0" r="3.5" fill="#e67e22" />
      <circle cx="-17" cy="-17" r="3.5" fill="#e67e22" />
    </g>
  </g>
  
  <!-- 标题 -->
  <text x="153" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="24" fill="#2c3e50">CaaS</text>
  <text x="153" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#2980b9" letter-spacing="1.5">CONTAINER ORCHESTRATION</text>
</svg>