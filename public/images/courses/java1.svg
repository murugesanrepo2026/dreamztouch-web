<svg xmlns="http://www.w3.org/2000/svg" width="306" height="266" viewBox="0 0 306 266">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f4f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e0d8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f89820;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e07a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5cba0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a373;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="306" height="266" rx="16" fill="url(#bg1)" />

  <!-- Java Coffee Cup -->
  <g transform="translate(153, 140)">
    <!-- Cup body -->
    <path d="M-55,-30 L-50,40 L50,40 L55,-30 Z" fill="#d4a373" stroke="#b8865a" stroke-width="2" />
    <!-- Cup inner -->
    <path d="M-45,-30 L-42,35 L42,35 L45,-30 Z" fill="url(#coffee)" />
    <!-- Cup handle -->
    <path d="M55,-20 C75,-20 80,0 70,15 C65,22 55,22 52,15" fill="none" stroke="#b8865a" stroke-width="5" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M-25,-40 C-30,-50 -15,-55 -20,-65" fill="none" stroke="#d4a373" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <path d="M-5,-42 C-10,-52 5,-58 0,-68" fill="none" stroke="#d4a373" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
    <path d="M15,-38 C10,-48 25,-54 20,-64" fill="none" stroke="#d4a373" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <!-- Java text -->
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#e07a1a">JAVA</text>
    <!-- Beans -->
    <circle cx="-20" cy="-18" r="5" fill="#6d4c2a" opacity="0.5" />
    <circle cx="15" cy="-22" r="4" fill="#6d4c2a" opacity="0.4" />
    <circle cx="5" cy="-10" r="3" fill="#6d4c2a" opacity="0.3" />
  </g>

  <!-- "Developer" label -->
  <text x="153" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="14" fill="#7a6b5a" letter-spacing="1">DEVELOPER</text>

  <!-- Small decor -->
  <circle cx="30" cy="30" r="6" fill="#f89820" opacity="0.15" />
  <circle cx="276" cy="236" r="8" fill="#f89820" opacity="0.12" />
  <rect x="20" y="240" width="40" height="3" rx="1.5" fill="#f89820" opacity="0.2" />
  <rect x="246" y="20" width="40" height="3" rx="1.5" fill="#f89820" opacity="0.2" />
</svg>