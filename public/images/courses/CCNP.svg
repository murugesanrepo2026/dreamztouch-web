<svg xmlns="http://www.w3.org/2000/svg" width="306" height="266" viewBox="0 0 306 266">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f0fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e4dbf5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="306" height="266" rx="16" fill="url(#bg3)" />
  
  <!-- 路由器集群 -->
  <g transform="translate(153, 125)">
    <!-- 主路由器 -->
    <rect x="-45" y="-25" width="90" height="35" rx="5" fill="#2c3e50" />
    <rect x="-35" y="-18" width="10" height="6" rx="1" fill="#27ae60" />
    <rect x="-20" y="-18" width="10" height="6" rx="1" fill="#27ae60" />
    <rect x="-5" y="-18" width="10" height="6" rx="1" fill="#f1c40f" />
    <rect x="10" y="-18" width="10" height="6" rx="1" fill="#27ae60" />
    <rect x="25" y="-18" width="10" height="6" rx="1" fill="#e74c3c" />
    <!-- 天线 -->
    <line x1="-30" y1="-25" x2="-35" y2="-50" stroke="#2c3e50" stroke-width="4" stroke-linecap="round" />
    <line x1="30" y1="-25" x2="35" y2="-50" stroke="#2c3e50" stroke-width="4" stroke-linecap="round" />
    <!-- 第二层小路由器 -->
    <rect x="-25" y="10" width="50" height="20" rx="4" fill="#34495e" />
    <rect x="-15" y="14" width="6" height="4" rx="1" fill="#27ae60" />
    <rect x="-3" y="14" width="6" height="4" rx="1" fill="#27ae60" />
    <rect x="9" y="14" width="6" height="4" rx="1" fill="#f1c40f" />
  </g>
  
  <!-- 标题 -->
  <text x="153" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="24" fill="#2c3e50">CCNP</text>
  <text x="153" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="13" fill="#6c3de8" letter-spacing="2">PROFESSIONAL</text>
</svg>