<svg xmlns="http://www.w3.org/2000/svg" width="306" height="266" viewBox="0 0 306 266">
  <defs>
    <linearGradient id="bg-ds" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d9f0fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chart1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#20b2aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008b8b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chart2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd343;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5c21a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chart3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e07a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dfe6e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b2bec3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="306" height="266" rx="16" fill="url(#bg-ds)" />

  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="6" fill="#3776ab" opacity="0.12" />
  <circle cx="276" cy="236" r="8" fill="#ffd343" opacity="0.15" />
  <rect x="20" y="240" width="40" height="3" rx="1.5" fill="#3776ab" opacity="0.15" />
  <rect x="246" y="20" width="40" height="3" rx="1.5" fill="#ffd343" opacity="0.15" />

  <!-- Central Python Badge -->
  <g transform="translate(153, 140)">
    <circle cx="0" cy="0" r="40" fill="#3776ab" />
    <circle cx="0" cy="0" r="36" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="32" fill="#ffffff">PY</text>
  </g>

  <!-- Bar Chart (Left) -->
  <g transform="translate(90, 110)">
    <rect x="0" y="20" width="12" height="30" rx="3" fill="url(#chart1)" />
    <rect x="18" y="0" width="12" height="50" rx="3" fill="url(#chart2)" />
    <rect x="36" y="30" width="12" height="20" rx="3" fill="url(#chart3)" />
  </g>

  <!-- Database Cylinder (Bottom Right) -->
  <g transform="translate(210, 150)">
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#dbGrad)" stroke="#95a5a6" stroke-width="1.5" />
    <path d="M-20,0 L-20,20 A20,8 0 0,0 20,20 L20,0" fill="url(#dbGrad)" stroke="#95a5a6" stroke-width="1.5" />
    <ellipse cx="0" cy="20" rx="20" ry="8" fill="none" stroke="#95a5a6" stroke-width="1.5" />
  </g>

  <!-- Magnifying Glass (Top Right) -->
  <g transform="translate(215, 85)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#3776ab" stroke-width="5" />
    <line x1="12" y1="12" x2="28" y2="28" stroke="#3776ab" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Text Labels -->
  <text x="153" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#2d3436">PYTHON</text>
  <text x="153" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="14" fill="#636e72">DATA SCIENCE</text>
</svg>